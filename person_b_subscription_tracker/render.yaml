# Render Blueprint for the subscription-cost-tracker FastAPI backend.
#
# The GitHub repository keeps this project in the `person_b_subscription_tracker/` sub-folder, so:
#   Render dashboard -> New -> Blueprint -> pick the repo ->
#   Blueprint Path = person_b_subscription_tracker/render.yaml
# (or copy this file to the repository root - rootDir below stays the same).
#
# Database: a Render PostgreSQL instance, because the free web-service disk is
# ephemeral (SQLite files are wiped on every deploy/restart and free services
# cannot attach a persistent disk). Free Render Postgres expires 30 days after
# creation and a workspace may only own one free database - upgrade the plan
# or recreate it before the expiry date. To use SQLite on a paid instance
# instead, attach a disk at /var/data and set DATABASE_URL=sqlite:////var/data/subscriptions.db
services:
  - type: web
    name: subscription-cost-tracker
    runtime: python
    plan: free
    rootDir: person_b_subscription_tracker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SERVICE_NAME
        value: subscription-cost-tracker
      - key: DATABASE_URL
        fromDatabase:
          name: subscription-tracker-db
          property: connectionString

databases:
  - name: subscription-tracker-db
    plan: free
    databaseName: subscriptions
    user: subscriptions
    ipAllowList: []   # only Render services in the same region/workspace can connect
